name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 排队期间定时任务可能已提交新行情；主分支发布必须使用最新快照。
          # PR 仍检验它自己的提交，避免用 main 掩盖改动。
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 构建 dist/
        run: npm run build

      - name: 回归测试
        run: npm test

      - name: 离线数据自检
        run: npm run check

      - name: 构建结果可复现
        run: git diff --exit-code -- dist/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
